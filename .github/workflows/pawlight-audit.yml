name: Pawlight audit bundle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build:vercel
      - uses: actions/upload-artifact@v4
        with:
          name: pawlight-public
          path: public
          if-no-files-found: error
          retention-days: 1
